<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="./style.css" />
    <title>Pokemon</title>
  </head>
  <body>
    <div class="container">
      <div class="not-character"><p>No Character Found</p></div>
      <header>
        <input type="text" id="input-text" placeholder="Search Here" />
        <button id="input-button">Search</button>
      </header>
      <div class="useless-content">
        <span id="dim-numbers"></span>
        <img src="./1891758-001bulbasaur.png" alt="pokemon" id="poke-image" />
      </div>
      <main>
        <div class="name"></div>
        <div class="feature-card"></div>
        <div class="card-section"></div>
        <div class="stats-table"></div>
      </main>
    </div>
    <script src="./script.js"></script>
  </body>
</html>
