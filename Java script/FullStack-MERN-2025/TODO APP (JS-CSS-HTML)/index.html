<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta
			name="viewport"
			content="width=device-width, initial-scale=1.0" />
		<title>Todo App - Vanilla JS</title>
		<link rel="stylesheet" href="style.css" />
		<link
			rel="stylesheet"
			href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
	</head>
	<body>
		<div class="container">
			<div class="header">
				<h1>Todo App</h1>
				<div class="input-section">
					<input
						type="text"
						id="taskInput"
						placeholder="Enter a new task..."
						class="task-input" />
					<button id="addBtn" class="add-btn">ADD</button>
				</div>
			</div>

			<div class="main-content">
				<div class="list-container" id="taskListContainer">
					<h2>Task List</h2>
					<ul id="taskList" class="task-list"></ul>
				</div>

				<div class="list-container" id="focusListContainer">
					<h2>Focus List</h2>
					<ul id="focusList" class="task-list"></ul>
				</div>

				<div class="list-container" id="finishedListContainer">
					<h2>Finished Tasks</h2>
					<ul id="finishedList" class="task-list"></ul>
				</div>
			</div>
		</div>

		<script src="script.js"></script>
	</body>
</html>
